name: Build RHVoice APK (avtomatik)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sizning repo fayllarini olish
        uses: actions/checkout@v4
        with:
          path: my-files

      - name: RHVoice manba kodini yuklab olish
        run: git clone --recursive https://github.com/RHVoice/RHVoice.git rhvoice-src

      - name: Tizim paketlarini o'rnatish
        run: sudo apt-get update && sudo apt-get install -y scons pkg-config build-essential

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Preprocessor faylini joylashtirish
        run: |
          TARGET_DIR="rhvoice-src/src/android/RHVoice-core/src/main/java/com/github/olga_yakovleva/rhvoice/android"
          cp my-files/PhoneNumberPreprocessor.java "$TARGET_DIR/PhoneNumberPreprocessor.java"

      - name: settings.xml faylini almashtirish
        run: |
          TARGET_XML="rhvoice-src/src/android/RHVoice-core/src/main/res/xml/settings.xml"
          cp my-files/settings.xml "$TARGET_XML"

      - name: RHVoiceService.java kodini avtomatik moslash
        run: |
          FILE="rhvoice-src/src/android/RHVoice-core/src/main/java/com/github/olga_yakovleva/rhvoice/android/RHVoiceService.java"

          # 1) Raqamlarni formatlash uchun speak() qatorini almashtirish
          if grep -q "tts.engine.speak(request.getText(), params, player);" "$FILE"; then
            sed -i 's/tts\.engine\.speak(request\.getText(), params, player);/String processedText = PhoneNumberPreprocessor.process(request.getText());\n            tts.engine.speak(processedText, params, player);/' "$FILE"
          else
            echo "OGOHLANTIRISH: speak() qatori topilmadi"
            exit 1
          fi

          # 2) Kiril-rus ovoz almashtirish kodini "String profileSpec" qatoridan oldin qo'shish
          if grep -q "String profileSpec = voiceProfileSpecBuilder.toString();" "$FILE"; then
            python3 my-files/patch_service.py "$FILE"
          else
            echo "OGOHLANTIRISH: profileSpec qatori topilmadi"
            exit 1
          fi

      - name: Gradle uchun xotirani oshirish
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
        working-directory: rhvoice-src/src/android

      - name: gradlew huquqi
        run: chmod +x ./gradlew
        working-directory: rhvoice-src/src/android

      - name: APK yig'ish (faqat kerakli variant)
        run: ./gradlew assembleStableRelease --stacktrace --no-daemon
        working-directory: rhvoice-src/src/android

      - name: APK'ni topish
        id: find_apk
        run: |
          APK_DIR="RHVoice-core/build/outputs/apk/stable/release"
          APK_FILE=$(find "$APK_DIR" -name "*.apk" | head -n 1)
          echo "apk_path=rhvoice-src/src/android/$APK_FILE" >> $GITHUB_OUTPUT
        working-directory: rhvoice-src/src/android

      - name: APK'ni Artifacts'ga yuklash
        uses: actions/upload-artifact@v4
        with:
          name: rhvoice-apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Tayyor Release yaratish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Tayyor APK - build #${{ github.run_number }}"
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
